services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: jotilpassword
      POSTGRES_DB: admission
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d admission" ]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    ports: [ "8080:8080" ]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=admission;Username=admin;Password=jotilpassword
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
